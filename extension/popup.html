<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chenuke</title>
  <link rel="stylesheet" href="popup.css">
  <style>
    #forceReportBtn {
      background: #3b82f6 !important;
      color: white !important;
      margin-top: 8px !important;
      width: 100% !important;
      padding: 10px !important;
      border: none !important;
      border-radius: 10px !important;
      cursor: pointer !important;
      font-weight: 600 !important;
      font-size: 0.98rem !important;
    }
    #forceReportBtn:hover {
      background: #60a5fa !important;
      transform: translateY(-2px) !important;
    }
  </style>
</head>
<body>
  <div class="container" role="main" aria-label="Chenuke Análisis de Contenido">
    
    <header class="header" role="banner">
      <h1 id="appTitle">Chenuke</h1>
      <p class="subtitle" id="appSubtitle">Análisis estructural del contenido</p>
    </header>

    <div class="scan-line" id="scanLine" aria-hidden="true"></div>

    <div id="cacheBadge" class="cache-badge hidden" role="status" aria-live="polite">
      <span aria-hidden="true">💾</span> Resultado en caché
    </div>

    <div id="backgroundBadge" class="background-badge hidden" role="status" aria-live="polite">
      <span class="spinner-small" aria-hidden="true"></span>
      Analizando en segundo plano...
    </div>

    <div id="labelBadge" class="signal-label" role="status" aria-live="assertive" aria-atomic="true">
      🔴 Alto riesgo
    </div>

    <section class="score-container" aria-label="Puntuación de riesgo">
      <div class="score-main">
        <span id="scoreValue" aria-label="Puntuación">85</span>
        <span class="score-label" aria-hidden="true"> /100</span>
      </div>
      <div class="confidence">
        Confianza: <span id="confidenceValue" aria-label="Porcentaje de confianza">25</span>%
      </div>
    </section>

    <section id="summarySection" aria-label="Resumen del análisis">
      <div id="summary" class="insight-box">
        Presión narrativa significativa detectada
      </div>
    </section>

    <div id="errorBox" class="error-box hidden" role="alert" aria-live="assertive">
      <span aria-hidden="true">⚠️</span>
      <span id="errorMessage"></span>
      <button id="retryErrorBtn" class="retry-btn" aria-label="Reintentar análisis">Reintentar</button>
    </div>

    <section id="proSection" class="pro-section">
      <div id="proWarning" class="warning hidden" role="alert">
        <span aria-hidden="true">⚠️</span> Hay señales más profundas que no estás viendo
      </div>
      
      <div id="proMetrics" class="hidden" aria-label="Métricas detalladas">
        <div class="pro-title">Métricas detalladas</div>
        <ul id="proList" class="pro-list" role="list"></ul>
      </div>
      
      <button id="upgradeBtn" class="upgrade-btn" style="display:block !important;">
        📊 Ver análisis completo
      </button>
    </section>

    <footer class="actions" role="contentinfo">
      <button id="analyzeBtn" aria-label="Iniciar nuevo análisis de la página">
        Analizar página
      </button>
      
      <button id="forceReportBtn">
        📊 Ver informe completo (FORZADO)
      </button>
      
      <button id="aiAnalyzeBtn" class="secondary-btn" style="margin-top: 6px;">
        <span aria-hidden="true">🤖</span> 
        <span id="aiBtnText">Analizar con IA (PRO)</span>
      </button>
      
      <button id="clearCacheBtn" class="secondary-btn hidden" aria-label="Limpiar caché de análisis">
        <span aria-hidden="true">🗑️</span> Limpiar caché
      </button>
    </footer>

  </div>
  
  <script src="popup.js" defer></script>
</body>
</html>
